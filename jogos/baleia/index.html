<!doctype html>
<html lang="pt-BR">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">

        <title>A Baleia Faminta — Acessível</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Nunito:wght@400;700&display=swap">
        
        <link rel="stylesheet" href="../../css/games-common.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="../../css/game-monitor.css">
    </head>

    <body class="game-page game-page-playfield">
        <div class="game-shell">
            <div class="game-site-bar">
                <a class="game-site-brand" href="../../index.html"><img src="../../imagens/logo-jogos.svg" alt="">Jogos Digitais Pedagógicos Acessíveis</a>
                <a class="game-home" href="../../index.html#jogos">← Todos os jogos</a>
            </div>
            <div class="game-monitor">
                <div class="game-monitor-screen">
            <header class="game-header">
                <h1>A Baleia Faminta</h1>
            </header>

            <div id="menuPrincipal" class="game-menu">
                <section class="game-menu-section" data-key="difficulty">
                    <h2>Escolha a dificuldade</h2>
                    <div class="game-menu-options">
                        <button class="menu-option" data-key="difficulty" data-value="easy">Fácil</button>
                        <button class="menu-option" data-key="difficulty" data-value="medium">Médio</button>
                        <button class="menu-option" data-key="difficulty" data-value="hard">Difícil</button>
                    </div>
                </section>
            </div>

            <main id="gameArea" class="game-main" hidden>
                <div id="gameInfo">
                    <div class="game-info-item" tabindex="0"><span>Pegue:</span><span id="targetItem">🐟</span></div>
                    <div class="game-info-item" tabindex="0"><span>Próximo:</span><span id="nextItem">🐠</span></div>
                    <div class="game-info-item" tabindex="0" aria-live="polite"><span>Pontos:</span><span id="score">0</span></div>
                    <div class="game-info-item" tabindex="0" aria-live="polite"><span>Vidas:</span><span id="lives">3</span>
                    </div>
                </div>
                <div id="gameContainer">
                    <canvas id="gameCanvas" width="400" height="600" tabindex="0" aria-label="Área da baleia e dos peixes"></canvas>
                </div>
            </main>
                </div>
                <div class="game-monitor-chin" aria-hidden="true"><span>CTA · IFRS</span><span><i class="game-monitor-light"></i></span></div>
            </div>
            <div class="game-monitor-stand" aria-hidden="true"></div>
            <div class="game-monitor-foot" aria-hidden="true"></div>
        </div>

        <script src="../../js/jquery-3.7.1.min.js"></script>
        <script src="../../js/games-common.js"></script>
        <script src="js/script.js"></script>
    </body>

</html>
