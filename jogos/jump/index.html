<!doctype html>
<html lang="pt-BR">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">

        <title>Jogo dos Saltos</title>

        <link rel="stylesheet" href="../../css/games-common.css">
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body class="game-page">
        <div class="game-shell">
            <header class="game-header">
                <a class="game-home" href="../../index.html#jogos">← Jogos</a>
                <h1>Jogo dos Saltos</h1>
            </header>

            <div id="start-screen" class="game-menu" hidden>
                <section class="game-menu-section option-group" data-key="difficulty">
                    <h2>Escolha a dificuldade</h2>
                    <div class="game-menu-options">
                        <button class="menu-option" data-key="difficulty" data-value="easy">Fácil</button>
                        <button class="menu-option" data-key="difficulty" data-value="medium">Médio</button>
                        <button class="menu-option" data-key="difficulty" data-value="hard">Difícil</button>
                    </div>
                </section>
            </div>

            <div class="game-over-screen" hidden>
                    <div class="game-over-box">
                    <h2 id="jumpGameOverTitle">Fim de jogo</h2>
                    <p class="game-over-message" id="final-score">Pontuação: 0</p>
                    <p id="high-score">Recorde: 0</p>
                    <button id="btnPlayAgain" class="game-over-option">Jogar Novamente</button>
                    <button id="jumpBackToMenu" class="game-over-option" data-action="menu">Voltar ao menu</button>
                </div>
            </div>

            <main class="gameboard game-main" hidden>
                <div class="game-screen" tabindex="0" aria-label="Área do jogo">
                    <div class="score" tabindex="0" aria-live="polite">Pontos: 0</div>
                    <div class="lives" tabindex="0" aria-label="Vidas">
                        <p>❤</p>
                        <p>❤</p>
                        <p>❤</p>
                    </div>
                    
                    <img src="assets/image/cloud.webp" class="cloud" alt=""><img src="assets/image/hero.gif" class="hero" alt="Jogador"><img src="assets/image/enemy.gif" class="enemy" alt="Obstáculo">
                    <div class="grass"></div>
                </div>
            </main>
        </div>
        
        <script src="../../js/jquery-3.7.1.min.js"></script>
        <script src="../../js/games-common.js"></script>
        <script src="js/script.js"></script>
    </body>

</html>
