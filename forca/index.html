<!DOCTYPE html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css" />
    
    <title>Jogo da Forca Acessível</title>
  </head>

  <body>
    <div id="menuContainer">
      <h1>Jogo da Forca Acessível</h1>
      
      <div class="menu-section">
        <h2>"Clique" ou aperte "Enter" ou "Espaço" para selecionar a dificuldade e iniciar o jogo. Boa diversão!</h2>
        
        <button class="menu-option" data-option="easy">Fácil</button>
        <button class="menu-option" data-option="medium">Médio</button>
        <button class="menu-option" data-option="hard">Dificíl</button>
      </div>
    </div>

    <div id="gameContainer">
      <div class="forca-container">
        <canvas id="hangman-canvas" width="200" height="250"></canvas>
        <div class="word-display" id="word-display"></div>
      </div>
      
      <div class="keyboard-container">
        <div class="keyboard" id="keyboard"></div>
      </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/scripts.js" defer></script>
  </body>
</html>
