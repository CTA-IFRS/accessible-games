<!doctype html>
<html lang="pt-BR">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">

        <title>Jogo da Colmeia Acessível</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Nunito:wght@400;700&display=swap">

        <link rel="stylesheet" href="../../css/games-common.css">
        <link rel="stylesheet" href="../../css/game-monitor.css">
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body class="game-page">
        <div class="game-shell">
            <div class="game-site-bar">
                <a class="game-site-brand" href="../../index.html"><img src="../../imagens/logo-jogos.svg" alt="">Jogos Digitais Pedagógicos Acessíveis</a>
                <a class="game-home" href="../../index.html#jogos">← Todos os jogos</a>
            </div>
            <div class="game-monitor">
                <div class="game-monitor-screen">
            <header class="game-header">
                <h1>Jogo da Colmeia</h1>
            </header>

            <div id="menuContainer" class="game-menu">
                <section class="game-menu-section" data-key="difficulty">
                    <h2>Escolha a dificuldade</h2>
                    <div class="game-menu-options">
                        <button class="menu-option" data-key="difficulty" data-value="slow">Fácil</button>
                        <button class="menu-option" data-key="difficulty" data-value="medium">Médio</button>
                        <button class="menu-option" data-key="difficulty" data-value="fast">Difícil</button>
                    </div>
                </section>
            </div>

            <main id="hiveGame" class="game-main" hidden>
                <div class="stage-lights" aria-hidden="true"></div>
                <div class="hive-hud">
                    <div id="feedback" tabindex="0" aria-live="polite"><span class="hud-label">Palavra</span><span id="typedWord"></span></div>
                    <div id="score" tabindex="0" aria-live="polite"><span class="hud-label">Pontos</span><strong id="points">0</strong></div>
                    <div class="lives-group"><span class="hud-label">Vidas</span><div id="vidas" tabindex="0" aria-label="Vidas">❤️❤️❤️</div></div>
                </div>
                <div class="stage-center" aria-hidden="true"><span class="stage-center-mark">♫</span></div>
                <div id="hitZone"><span>TOQUE AGORA</span></div>
                <p class="stage-tip">Use o teclado ou clique na área do jogo</p>
            </main>
                </div>
                <div class="game-monitor-chin" aria-hidden="true"><span>CTA · IFRS</span><span><i class="game-monitor-light"></i></span></div>
            </div>
            <div class="game-monitor-stand" aria-hidden="true"></div>
            <div class="game-monitor-foot" aria-hidden="true"></div>
        </div>

        <script src="../../js/jquery-3.7.1.min.js"></script>
        <script src="../../js/games-common.js"></script>
        <script src="js/scripts.js" defer></script>
    </body>

</html>
